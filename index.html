function step(o,v){

 if(!v)return;
 const vy=o.vy;o.y+=vy;o.on=false;
 c0=Math.floor(o.x/T);c1=Math.floor((o.x+o.w-1)/T);r0=Math.floor(o.y/T);r1=Math.floor((o.y+o.h-1)/T);
 let hit=0,sp6=0,sr=0,sq=0;
 for(let r=r0;r<=r1;r++)for(let q=c0;q<=c1;q++)if(sol(q,r)){
  hit=1;
  if(vy>0){
   o.y=r*T-o.h;o.on=true;

    if(map[r][q]===6){sp6=1;sr=r;sq=q}

}
